[package]
name = "rainbowave"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A luminous field of flowing rainbow ribbons for your terminal"
repository = "https://github.com/yummydirtx/rainbowave-cli"
keywords = ["animation", "ansi", "cli", "rainbow", "terminal"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"

[profile.release]
codegen-units = 1
lto = true
strip = true
